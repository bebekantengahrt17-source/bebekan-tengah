<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin — Kampung Bebekan Tengah</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f7f4;
      color: #17351f;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .subtitle {
      color: #68756c;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }

    input,
    textarea {
      border: 1px solid #d5ddd7;
      outline: none;
      margin-top: 6px;
    }

    input:focus,
    textarea:focus {
      border-color: #218642;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: none;
      background: #18723a;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: .9;
    }

    .btn-secondary {
      background: #e8eee9;
      color: #17351f;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .status {
      background: #edf7ef;
      padding: 13px;
      border-radius: 10px;
      margin: 15px 0;
    }

    .error {
      background: #fff0f0;
      color: #a01919;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .topbar button {
      width: auto;
      padding: 11px 20px;
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .login-box {
      max-width: 500px;
      margin: 60px auto;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
      color: #18723a;
    }

    @media(max-width:700px) {
      .grid,
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar button {
        width: 100%;
      }

      .container {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

    <p class="subtitle">

    <form id="loginForm">

        placeholder="Masukkan password"

      <button type="submit">
        🔐 Masuk Dashboard

  </div>


  <!-- ================= DASHBOARD ================= -->

  <div id="dashboardSection" class="hidden">

    <div class="topbar">

      <div>
        <h1>Dashboard Admin</h1>
        <div id="userInfo" class="subtitle"></div>
      </div>

      <button
        id="logoutButton"
        class="btn-secondary"
      >
        Keluar
      </button>

    </div>


    <div id="dashboardStatus" class="status">
      Menghubungkan ke database...

    <!-- STATISTIK -->

    <div class="stats">

      </div>

        <div>Pengurus</div>
      </div>

      <div class="stat">
        <div class="stat-number" id="countGallery">0</div>

      </div>

    </div>


    <!-- ================= KONTEN BERANDA ================= -->

    <div class="card">

      <h2>🏠 Konten Beranda</h2>

      <div class="grid">

        <div>
          <label>Judul Utama</label>

        <div>

    <!-- ================= PENGUMUMAN ================= -->

    <div class="card">

      <h2>📢 Tambah Pengumuman</h2>

        <div>
          <label>Judul</label>
          <input
            id="announcementTitle"

        </div>

        <div>
          <label>Tanggal</label>

            id="announcementDate"

          >

      </div>

      <label>Isi Pengumuman</label>

      <textarea

    <!-- ================= AGENDA ================= -->

    <div class="card">

      <h2>📅 Tambah Agenda Kegiatan</h2>

      <div class="grid">

        <div>
          <label>Nama Kegiatan</label>
          <input
            id="eventTitle"
            placeholder="Contoh: Kerja Bakti"
          >
        </div>

        <div>
          <label>Tanggal</label>
          <input
            id="eventDate"
            type="date"
          >
        </div>

        <div>
          <label>Jam</label>
          <input
            id="eventTime"
            placeholder="Contoh: 07:00"

        <div>

        id="eventBody"
        placeholder="Keterangan kegiatan..."
      ></textarea>

      <button id="addEvent">
        ➕ Tambah Agenda
      </button>

    </div>


    <!-- ================= KONTAK ================= -->

    <div class="card">

      <h2>📞 Kontak RT</h2>

      <div class="grid">

        <div>
          <label>Nama Ketua RT</label>
          <input id="leaderName">
        </div>

        <div>
          <label>WhatsApp</label>
          <input id="whatsapp">
        </div>

        <div>
          <label>Email</label>
          <input
            id="contactEmail"
            type="email"
          >
        </div>

          <label>Google Maps</label>
          <input id="mapsUrl">
        </div>

      </div>

      <label>Alamat</label>

      <textarea id="address"></textarea>

      <button id="saveContact">
        💾 Simpan Kontak
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   KONFIGURASI SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://xqzwlcqiiugspvgpkyke.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WHAW-3VN1jXAObMRADequQ_WR70OlfB";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   HELPER
   ===================================================== */

function showStatus(element, message, error = false) {

  element.textContent = message;

  element.classList.remove("hidden");

  if (error) {
    element.classList.add("error");
  } else {
    element.classList.remove("error");
  }

}


/* =====================================================
   CEK SESSION
   ===================================================== */

async function checkSession() {

  const {
    data: { session },
    error
  } = await supabaseClient.auth.getSession();

  if (error) {

    showStatus(
      document.getElementById("loginStatus"),
      "Gagal memeriksa session: " + error.message,
      true
    );

    return;

  }


  if (!session) {

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document
      .getElementById("dashboardSection")
      .classList.add("hidden");

    return;

  }


  await verifyAdmin(session);

}


/* =====================================================
   CEK ADMIN
   ===================================================== */

async function verifyAdmin(session) {

  const {
    data,
    error
  } = await supabaseClient.rpc("is_admin");


  if (error) {

    await supabaseClient.auth.signOut();

    showStatus(
      document.getElementById("loginStatus"),
      "Gagal mengecek status admin: " + error.message,
      true
    );

    return;

  }


  if (data !== true) {

    await supabaseClient.auth.signOut();

    showStatus(
      document.getElementById("loginStatus"),
      "Akun berhasil login tetapi belum terdaftar sebagai admin.",
      true
    );

    return;

  }


  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("dashboardSection")
    .classList.remove("hidden");


  document.getElementById("userInfo").textContent =
    "Login sebagai: " +
    (session.user.email || session.user.id);


  await loadDashboard();

}


/* =====================================================
   LOGIN
   ===================================================== */

document
  .getElementById("loginForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();


    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    showStatus(
      document.getElementById("loginStatus"),
      "Sedang login..."
    );


    const {
      data,
      error
    } = await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


    if (error) {

      showStatus(
        document.getElementById("loginStatus"),
        "Login gagal: " + error.message,
        true
      );

      return;

    }


    await verifyAdmin(data.session);

  });


/* =====================================================
   LOAD DASHBOARD
   ===================================================== */

async function loadDashboard() {

  const status =
    document.getElementById("dashboardStatus");


  showStatus(
    status,
    "Menghubungkan ke Supabase..."
  );


  /* SITE CONTENT */

  const {
    data: content,
    error: contentError
  } = await supabaseClient
    .from("site_content")
    .select("*")
    .eq("id", 1)
    .maybeSingle();


  if (contentError) {

    showStatus(
      status,
      "Gagal mengambil site_content: " +
      contentError.message,
      true
    );

    return;

  }


  if (content) {

    document.getElementById("hero_title").value =
      content.hero_title || "";

    document.getElementById("hero_sub").value =
      content.hero_sub || "";

    document.getElementById("slogan").value =
      content.slogan || "";

    document.getElementById("welcome").value =
      content.welcome || "";

    document.getElementById("hero_image").value =
      content.hero_image || "";

    document.getElementById("profile").value =
      content.profile || "";

    document.getElementById("history").value =
      content.history || "";

    document.getElementById("kelurahan").value =
      content.kelurahan || "";

    document.getElementById("kecamatan").value =
      content.kecamatan || "";

    document.getElementById("kota").value =
      content.kota || "";

    document.getElementById("provinsi").value =
      content.provinsi || "";

  }


  /* CONTACT */

  const {
    data: contact
  } = await supabaseClient
    .from("contact")
    .select("*")
    .eq("id", 1)
    .maybeSingle();


  if (contact) {

    document.getElementById("leaderName").value =
      contact.leader_name || "";

    document.getElementById("whatsapp").value =
      contact.whatsapp || "";

    document.getElementById("contactEmail").value =
      contact.email || "";

    document.getElementById("address").value =
      contact.address || "";

    document.getElementById("mapsUrl").value =
      contact.maps_url || "";

  }


  /* COUNT DATA */

  const tables = [
    ["announcements", "countAnnouncements"],
    ["events", "countEvents"],
    ["staff", "countStaff"],
    ["gallery", "countGallery"]
  ];


  for (const [table, element] of tables) {

    const { count } =
      await supabaseClient
        .from(table)
        .select("*", {
          count: "exact",
          head: true
        });

    document.getElementById(element).textContent =
      count ?? 0;

  }


  showStatus(
    status,
    "✓ Terhubung ke database Supabase"
  );

}


/* =====================================================
   SIMPAN BERANDA
   ===================================================== */

document
  .getElementById("saveContent")
  .addEventListener("click", async function() {

    const payload = {

      hero_title:
        document.getElementById("hero_title").value,

      hero_sub:
        document.getElementById("hero_sub").value,

      slogan:
        document.getElementById("slogan").value,

      welcome:
        document.getElementById("welcome").value,

      hero_image:
        document.getElementById("hero_image").value,

      profile:
        document.getElementById("profile").value,

      history:
        document.getElementById("history").value,

      kelurahan:
        document.getElementById("kelurahan").value,

      kecamatan:
        document.getElementById("kecamatan").value,

      kota:
        document.getElementById("kota").value,

      provinsi:
        document.getElementById("provinsi").value,

      updated_at:
        new Date().toISOString()

    };


    const { error } =
      await supabaseClient
        .from("site_content")
        .update(payload)
        .eq("id", 1);


    showStatus(
      document.getElementById("dashboardStatus"),
      error
        ? "Gagal menyimpan: " + error.message
        : "✓ Konten beranda berhasil disimpan",
      !!error
    );

  });


/* =====================================================
   TAMBAH PENGUMUMAN
   ===================================================== */

document
  .getElementById("addAnnouncement")
  .addEventListener("click", async function() {

    const title =
      document.getElementById("announcementTitle").value;

    const body =
      document.getElementById("announcementBody").value;

    const date =
      document.getElementById("announcementDate").value;


    if (!title || !body) {

      showStatus(
        document.getElementById("dashboardStatus"),
        "Judul dan isi pengumuman wajib diisi.",
        true
      );

      return;

    }


    const { error } =
      await supabaseClient
        .from("announcements")
        .insert({
          title,
          body,
          date: date || null
        });


    if (error) {

      showStatus(
        document.getElementById("dashboardStatus"),
        "Gagal menambah pengumuman: " +
        error.message,
        true
      );

      return;

    }


    document.getElementById("announcementTitle").value = "";
    document.getElementById("announcementBody").value = "";
    document.getElementById("announcementDate").value = "";


    showStatus(
      document.getElementById("dashboardStatus"),
      "✓ Pengumuman berhasil ditambahkan"
    );


    loadDashboard();

  });


/* =====================================================
   TAMBAH AGENDA
   ===================================================== */

document
  .getElementById("addEvent")
  .addEventListener("click", async function() {

    const title =
      document.getElementById("eventTitle").value;

    const date =
      document.getElementById("eventDate").value;

    const time =
      document.getElementById("eventTime").value;

    const place =
      document.getElementById("eventPlace").value;

    const body =
      document.getElementById("eventBody").value;


    if (!title || !date) {

      showStatus(
        document.getElementById("dashboardStatus"),
        "Nama kegiatan dan tanggal wajib diisi.",
        true
      );

      return;

    }


    const { error } =
      await supabaseClient
        .from("events")
        .insert({
          title,
          date,
          time: time || null,
          place: place || null,
          body: body || null
        });


    if (error) {

      showStatus(
        document.getElementById("dashboardStatus"),
        "Gagal menambah agenda: " +
        error.message,
        true
      );

      return;

    }


    document.getElementById("eventTitle").value = "";
    document.getElementById("eventDate").value = "";
    document.getElementById("eventTime").value = "";
    document.getElementById("eventPlace").value = "";
    document.getElementById("eventBody").value = "";


    showStatus(
      document.getElementById("dashboardStatus"),
      "✓ Agenda berhasil ditambahkan"
    );


    loadDashboard();

  });


/* =====================================================
   SIMPAN KONTAK
   ===================================================== */

document
  .getElementById("saveContact")
  .addEventListener("click", async function() {

    const payload = {

      leader_name:
        document.getElementById("leaderName").value,

      whatsapp:
        document.getElementById("whatsapp").value,

      email:
        document.getElementById("contactEmail").value,

      address:
        document.getElementById("address").value,

      maps_url:
        document.getElementById("mapsUrl").value

    };


    const { error } =
      await supabaseClient
        .from("contact")
        .update(payload)
        .eq("id", 1);


    showStatus(
      document.getElementById("dashboardStatus"),
      error
        ? "Gagal menyimpan kontak: " + error.message
        : "✓ Kontak RT berhasil disimpan",
      !!error
    );

  });


/* =====================================================
   LOGOUT
   ===================================================== */

document
  .getElementById("logoutButton")
  .addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    location.reload();

  });
