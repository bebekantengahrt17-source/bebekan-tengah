<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Admin Kampung</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #064d31, #0b8a50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #17352a;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    h1 {
      margin-top: 0;
      color: #064d31;
      font-size: 28px;
    }

    p {
      color: #65766e;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5e0da;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #087443;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #msg {
      margin-top: 18px;
      font-size: 15px;
    }

    .success {
      color: #087443;
    }

    .error {
      color: #c43d3d;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔐 Buat Password Baru</h1>

    <p>
      Masukkan password baru untuk akun Admin Kampung
      Bebekan Tengah RT 17 / RW 05.
    </p>

    <div id="formArea" class="hidden">

      <label>Password Baru</label>
      <input
        id="password"
        type="password"
        placeholder="Minimal 6 karakter"
      >

      <label>Konfirmasi Password</label>
      <input
        id="confirmPassword"
        type="password"
        placeholder="Ulangi password baru"
      >

      <button id="saveBtn" onclick="changePassword()">
        Simpan Password Baru
      </button>

    </div>

    <p id="msg">Memeriksa link reset...</p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const sb = supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    const formArea = document.getElementById("formArea");
    const msg = document.getElementById("msg");

    function showForm() {
      formArea.classList.remove("hidden");
      msg.textContent = "Silakan buat password baru.";
      msg.className = "";
    }

    async function checkRecovery() {

      const { data, error } = await sb.auth.getSession();

      if (error) {
        msg.textContent = "Gagal memeriksa sesi reset password.";
        msg.className = "error";
        return;
      }

      if (data.session) {
        showForm();
      } else {
        msg.textContent =
          "Link reset password tidak valid atau sudah kedaluwarsa.";
        msg.className = "error";
      }
    }

    sb.auth.onAuthStateChange((event, session) => {

      if (event === "PASSWORD_RECOVERY" && session) {
        showForm();
      }

    });

    async function changePassword() {

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 6) {
        msg.textContent =
          "Password minimal 6 karakter.";
        msg.className = "error";
        return;
      }

      if (password !== confirmPassword) {
        msg.textContent =
          "Konfirmasi password tidak sama.";
        msg.className = "error";
        return;
      }

      const button =
        document.getElementById("saveBtn");

      button.disabled = true;
      button.textContent = "Menyimpan...";

      const { error } =
        await sb.auth.updateUser({
          password: password
        });

      if (error) {

        msg.textContent =
          "Gagal mengubah password: " + error.message;

        msg.className = "error";

        button.disabled = false;
        button.textContent =
          "Simpan Password Baru";

        return;
      }

      msg.textContent =
        "✅ Password berhasil diubah! Mengarahkan ke Admin...";

      msg.className = "success";

      setTimeout(() => {
        window.location.href =
          "admin.html";
      }, 2000);
    }

    checkRecovery();
  </script>

</body>
  </html>
